<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found - CVSS Guru</title>
    <link rel="icon" type="image/svg+xml" href="{{ static_url('favicon.svg') }}">
    {% include "partials/theme_head.html" %}
    <link rel="stylesheet" href="{{ static_url('vendor/phosphor/regular/style.css') }}">
    <link rel="stylesheet" href="{{ static_url('vendor/fonts/fonts.css') }}">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .nav-category {
            display: flex; align-items: center; gap: 8px;
            background: rgb(var(--surface) / 0.7);
            border: 1px solid rgb(var(--zinc-700) / 0.25);
            border-radius: 14px; padding: 11px 22px;
            color: rgb(var(--zinc-500)); font-weight: 600; font-size: 0.875rem;
            text-decoration: none; transition: all 0.2s; cursor: pointer;
        }
        .nav-category:hover { background: rgb(var(--zinc-800) / 0.8); color: rgb(var(--zinc-300)); border-color: rgb(var(--zinc-700) / 0.5); }
        .nav-category.active { background: rgb(var(--accent) / 0.12); border-color: rgb(var(--accent) / 0.45); color: rgb(var(--accent-fg)); }
        .cat-icon {
            width: 28px; height: 28px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem; background: rgb(var(--zinc-700) / 0.3); transition: background 0.2s;
        }
        .nav-category.active .cat-icon { background: rgb(var(--accent) / 0.2); color: rgb(var(--accent-fg)); }
        .version-tab {
            background: rgb(var(--zinc-800) / 0.4); border: 1px solid rgb(var(--zinc-700) / 0.2);
            border-radius: 10px; padding: 7px 16px; color: rgb(var(--zinc-500));
            font-weight: 500; font-size: 0.8rem; text-decoration: none;
            transition: all 0.2s; display: inline-flex; align-items: center; cursor: pointer;
        }
        .version-tab:hover { background: rgb(var(--zinc-800) / 0.7); color: rgb(var(--zinc-300)); border-color: rgb(var(--zinc-700) / 0.4); }
        .version-tab.active { background: rgb(var(--accent) / 0.12); border-color: rgb(var(--accent) / 0.4); color: rgb(var(--accent-fg)); }
        .glass-card {
            background: rgb(var(--surface) / 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgb(var(--zinc-700) / 0.2);
            border-radius: 16px;
        }
    </style>
    <link rel="stylesheet" href="{{ static_url('css/app.css') }}">
</head>
<body class="text-zinc-200">
    {% include "partials/header.html" %}
    {% set active_category = None %}
    {% include "partials/nav.html" %}

    <main class="max-w-2xl mx-auto px-4 pb-8">
        <div class="glass-card p-10 text-center">
            <p class="h-label mb-3">Error 404</p>
            <h1 class="h-page mb-3">Page not found</h1>
            <p class="h-sub mb-8">The page <code class="font-mono text-zinc-400">{{ path }}</code> does not exist or has moved.</p>
            <div class="flex flex-wrap justify-center gap-3 text-sm">
                <a href="/" class="px-4 py-2 rounded-xl border border-zinc-700/50 hover:border-amber-500/50 hover:text-amber-400">CVSS Calculator</a>
                <a href="/cve-search" class="px-4 py-2 rounded-xl border border-zinc-700/50 hover:border-amber-500/50 hover:text-amber-400">CVE Search</a>
                <a href="/documentation" class="px-4 py-2 rounded-xl border border-zinc-700/50 hover:border-amber-500/50 hover:text-amber-400">CVSS Guide</a>
            </div>
        </div>
    </main>

    {% include "partials/footer.html" %}
</body>
</html>
